name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  truth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit
      - name: Tests
        run: pnpm test
      - name: Demand import
        run: pnpm demand:import
      - name: Truth gate
        run: pnpm exec tsx scripts/truth-gate.ts
      - name: Graph validation
        run: pnpm graph:health
      - name: SEO + sitemap validation
        run: pnpm exec tsx scripts/seo-audit.ts
        env:
          PUBLIC_SITE_LIVE: "false"
