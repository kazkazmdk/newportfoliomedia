name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  folio:
    name: Folio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  beyond:
    name: Beyond Memories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/beyond_memories
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/beyond_memories/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dametis:
    name: Dametis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/dametis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/dametis/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  skatdesigner:
    name: Skatdesigner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/skatdesigner
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/skatdesigner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  three-template:
    name: Three template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/three_template
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/three_template/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
