name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SITE_LIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Truth gate
        run: pnpm truth-gate
      - name: Graph audit
        run: pnpm graph:health
      - name: Demand audit
        run: pnpm demand:audit
      - name: SEO audit
        run: pnpm seo:audit
      - name: Sitemap audit
        run: pnpm sitemap:audit
